# hospital-frontend on its own, in Docker.
#
#   docker compose up -d --build        # http://localhost:3000
#
# Builds the production image from ./Dockerfile (Next.js standalone server)
# and runs it — the same image a deploy ships. It needs only an API to talk
# to; nothing from hospital-backend is built or started here.
#
# API_BASE_URL is read by the server at request time, not baked into the
# build, so one image serves every environment. Inside a container
# `localhost` is the container itself, so the default points at the host
# machine, where hospital-backend publishes port 8000 (uvicorn on the host, or
# its own `docker compose --profile app up`). For a deployed API, set
# DOCKER_API_BASE_URL, e.g. https://api.example.com/api/v1.
name: hospital-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      # Optional: the same file `npm run dev` reads. Its API_BASE_URL is a
      # host address, so the value below replaces it.
      - path: .env.local
        required: false
    environment:
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      # Docker Desktop provides host.docker.internal already; Linux needs this.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
