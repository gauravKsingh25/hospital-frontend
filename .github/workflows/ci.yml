name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint, typecheck, unit tests, production build
      - run: npm run verify

  # The generated API types (openapi.json, src/types/*.generated.ts) must match
  # hospital-backend's main. Needs read access to that repo: if it is private,
  # add a fine-grained token with Contents: read as the BACKEND_REPO_TOKEN
  # secret, then set the repository variable BACKEND_CONTRACT_CHECK=true.
  api-contract:
    if: vars.BACKEND_CONTRACT_CHECK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hospital-frontend
      - uses: actions/checkout@v4
        with:
          repository: gauravKsingh25/hospital-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: hospital-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ./hospital-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hospital-frontend/package-lock.json
      - run: npm ci
        working-directory: hospital-frontend
      - run: npm run codegen:check
        working-directory: hospital-frontend
        env:
          BACKEND_PYTHON: python
